<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zunex.hire - Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fly {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(6deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .flying-plane {
            animation: fly 1.2s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen py-10 px-4 relative">

    <div id="globalLoader" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center space-y-4 hidden">
        <div class="w-16 h-16 rounded-full border-2 border-amber-500/30 border-t-amber-400 flex items-center justify-center shadow-xl bg-amber-500/10">
            <i class="fa-solid fa-plane text-amber-400 text-2xl flying-plane"></i>
        </div>
        <p id="loaderText" class="text-amber-400 font-medium text-sm tracking-wide">Processing your request...</p>
    </div>

    <div class="max-w-3xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-amber-400">Zunex.hire</h1>
            <p class="text-slate-400 mt-2">Submit your post securely to Zunex.hire</p>
        </div>

        <div class="bg-[#1e293b] p-6 rounded-xl shadow-xl border border-slate-700 mb-10">
            <form id="jobForm" onsubmit="return false;" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Title</label>
                    <input type="text" id="title" required placeholder="Enter title here..." class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Description / Snippet</label>
                    <textarea id="snippet" rows="4" required placeholder="Enter description here..." class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Link</label>
                        <input type="url" id="link" placeholder="https://example.com" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Country</label>
                        <input type="text" id="country" placeholder="Enter country name..." class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Category</label>
                        <select id="category" required class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                            <option value="" disabled selected>Select Category</option>
                            <option value="Job">Job</option>
                            <option value="Visa">Visa</option>
                            <option value="Travel">Travel</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Query / Search Keyword</label>
                        <input type="text" id="query_used" placeholder="e.g. Remote developer jobs in Europe" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                </div>

                <button type="button" id="submitBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition duration-200 shadow-lg cursor-pointer">
                    Submit to Zunex.hire
                </button>
            </form>
        </div>

        <div class="bg-[#1e293b] p-6 rounded-xl shadow-xl border border-slate-700">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-semibold text-amber-400">Recent Submissions History</h2>
                <button onclick="fetchHistory()" class="text-xs px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded border border-slate-600 transition">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Refresh
                </button>
            </div>
            <div id="historyList" class="space-y-4">
                <p class="text-slate-400 text-sm text-center py-4">Loading history...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cwvcmynqcjreebcmepqf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN3dmNteW5xY2pyZWViY21lcHFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4NTYwODgsImV4cCI6MjA5ODQzMjA4OH0.AAVvDnU0NBI8leb9UHJJicFADmH2ywqXf4Nd9mZ3T6U';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const submitBtn = document.getElementById('submitBtn');
        const historyList = document.getElementById('historyList');
        const globalLoader = document.getElementById('globalLoader');
        const loaderText = document.getElementById('loaderText');

        function showLoader(text) {
            loaderText.innerText = text || 'Processing...';
            globalLoader.classList.remove('hidden');
        }

        function hideLoader() {
            globalLoader.classList.add('hidden');
        }

        async function fetchHistory() {
            const { data, error } = await supabaseClient
                .from('Zunex')
                .select('*')
                .order('id', { ascending: false })
                .limit(10);

            if (error) {
                historyList.innerHTML = `<p class="text-red-400 text-sm text-center py-2">Failed to load history: ${error.message}</p>`;
                return;
            }

            if (data && data.length > 0) {
                historyList.innerHTML = '';
                data.forEach(itemData => {
                    const dateFormatted = itemData.created_at ? new Date(itemData.created_at).toLocaleString() : 'Just now';
                    
                    const item = document.createElement('div');
                    item.className = "p-4 bg-[#0f172a] rounded-lg border border-slate-700 space-y-3";
                    item.innerHTML = `
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                            <span class="text-xs font-mono text-amber-400 font-semibold">ID: #${itemData.id}</span>
                            <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30">
                                ${itemData.category || 'General'}
                            </span>
                        </div>
                        <div>
                            <h4 class="font-bold text-white text-base">${itemData.title || 'Untitled'}</h4>
                            <p class="text-slate-300 text-sm mt-1 whitespace-pre-wrap">${itemData.snippet || ''}</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs text-slate-400 pt-2 border-t border-slate-800">
                            <div>Country: <span class="text-slate-200 font-medium">${itemData.country || 'N/A'}</span></div>
                            <div>Query: <span class="text-slate-200 font-medium">${itemData.query_used || 'N/A'}</span></div>
                            <div class="md:col-span-2 truncate">Link: <a href="${itemData.link || '#'}" target="_blank" class="text-blue-400 hover:underline">${itemData.link || 'N/A'}</a></div>
                            <div class="md:col-span-2 text-slate-500 text-[11px]">Saved at: ${dateFormatted}</div>
                        </div>
                    `;
                    historyList.appendChild(item);
                });
            } else {
                historyList.innerHTML = '<p class="text-slate-400 text-sm text-center py-4">No submissions found yet.</p>';
            }
        }

        submitBtn.addEventListener('click', async () => {
            const title = document.getElementById('title').value;
            const snippet = document.getElementById('snippet').value;

            if(!title || !snippet) {
                alert('Please fill in the required fields (Title and Description)!');
                return;
            }

            submitBtn.disabled = true;
            showLoader('Saving to Database...');

            const payload = {
                title: title,
                snippet: snippet,
                link: document.getElementById('link').value,
                country: document.getElementById('country').value,
                category: document.getElementById('category').value,
                query_used: document.getElementById('query_used').value
            };

            const { error } = await supabaseClient.from('Zunex').insert([payload]);

            if (error) {
                hideLoader();
                alert('Database Error: ' + error.message);
            } else {
                document.getElementById('jobForm').reset();
                loaderText.innerText = 'Success! Updating history...';
                await fetchHistory();
                hideLoader();
            }

            submitBtn.disabled = false;
        });

        showLoader('Connecting to Database...');
        fetchHistory().then(() => hideLoader());
    </script>
</body>
</html>
