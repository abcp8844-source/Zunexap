<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zunex.hire - Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes fly {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .flying-plane {
            animation: fly 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen py-10 px-4">
    <div class="max-w-2xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-amber-400">Zunex.hire</h1>
            <p class="text-slate-400 mt-2">Submit your post securely to Zunex.hire</p>
        </div>

        <div class="bg-[#1e293b] p-6 rounded-xl shadow-xl border border-slate-700 mb-10">
            <form id="jobForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Title</label>
                    <input type="text" id="title" required placeholder="Enter title here..." class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Description / Snippet</label>
                    <textarea id="snippet" rows="4" required placeholder="Enter description here..." class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Link</label>
                        <input type="url" id="link" placeholder="https://example.com" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Country</label>
                        <input type="text" id="country" placeholder="Enter country name..." class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Category</label>
                        <select id="category" required class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                            <option value="" disabled selected>Select Category</option>
                            <option value="Job">Job</option>
                            <option value="Visa">Visa</option>
                            <option value="Travel">Travel</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Query / Search Keyword <span class="text-xs text-amber-400 font-normal">(Internal system search term)</span></label>
                        <input type="text" id="query_used" placeholder="e.g. Remote developer jobs in Europe" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition duration-200 shadow-lg">
                    Submit to Zunex.hire
                </button>
            </form>
        </div>

        <div class="bg-[#1e293b] p-6 rounded-xl shadow-xl border border-slate-700">
            <h2 class="text-xl font-semibold mb-4 text-amber-400">Recent Submissions</h2>
            <div id="historyList" class="space-y-3">
                <div class="flex flex-col items-center justify-center py-6 space-y-3">
                    <div class="w-12 h-12 rounded-full border-2 border-amber-500/30 border-t-amber-400 flex items-center justify-center shadow-md bg-amber-500/10">
                        <i class="fa-solid fa-plane text-amber-400 text-lg flying-plane"></i>
                    </div>
                    <p class="text-slate-400 text-sm">Loading recent submissions...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // یہاں آپ کے Vercel کے ویری ایبل ناموں کے مطابق سیٹ کر دیا گیا ہے
        const SUPABASE_URL = window.VEX_SUPABASE_URL || 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = window.VEX_SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('jobForm');
        const historyList = document.getElementById('historyList');

        async function fetchHistory() {
            const { data, error } = await supabaseClient
                .from('Zunex')
                .select('id, title, created_at')
                .order('id', { ascending: false })
                .limit(10);

            if (error) {
                historyList.innerHTML = '<p class="text-red-400 text-sm">Failed to load history: ' + error.message + '</p>';
                return;
            }

            if (data && data.length > 0) {
                historyList.innerHTML = '';
                data.forEach(itemData => {
                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between p-3 bg-[#0f172a] rounded-lg border border-slate-700";
                    item.innerHTML = `
                        <div>
                            <h4 class="font-medium text-white">${itemData.title}</h4>
                            <span class="text-xs text-slate-400">ID: #${itemData.id}</span>
                        </div>
                        <span class="px-3 py-1 text-xs font-semibold rounded-full border bg-amber-500/20 text-amber-400 border-amber-500/30">
                            Submitted
                        </span>
                    `;
                    historyList.appendChild(item);
                });
            } else {
                historyList.innerHTML = '<p class="text-slate-400 text-sm">No submissions found yet.</p>';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Submitting...';

            const payload = {
                title: document.getElementById('title').value,
                snippet: document.getElementById('snippet').value,
                link: document.getElementById('link').value,
                country: document.getElementById('country').value,
                category: document.getElementById('category').value,
                query_used: document.getElementById('query_used').value
            };

            const { error } = await supabaseClient.from('Zunex').insert([payload]);

            if (error) {
                alert('Error: ' + error.message);
            } else {
                form.reset();
                fetchHistory();
                alert('Post successfully submitted to Zunex.hire!');
            }

            btn.disabled = false;
            btn.innerText = 'Submit to Zunex.hire';
        });

        fetchHistory();
    </script>
</body>
</html>
