<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Submission Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen py-10 px-4">
    <div class="max-w-2xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-amber-400">Job Submission Portal</h1>
            <p class="text-slate-400 mt-2">Submit raw job entries directly to the database</p>
        </div>

        <div class="bg-[#1e293b] p-6 rounded-xl shadow-xl border border-slate-700 mb-10">
            <form id="jobForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Job Title</label>
                    <input type="text" id="title" required placeholder="e.g. Software Engineer" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Job Description / Snippet</label>
                    <textarea id="snippet" rows="4" required placeholder="Enter description here..." class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Link</label>
                        <input type="url" id="link" placeholder="https://example.com" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Country</label>
                        <input type="text" id="country" placeholder="e.g. China" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Category</label>
                        <select id="category" required class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                            <option value="" disabled selected>Select Category</option>
                            <option value="Visa">Visa</option>
                            <option value="Travel">Travel</option>
                            <option value="Guide">Guide</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Query Used</label>
                        <input type="text" id="query_used" placeholder="e.g. Direct Agent Submission" class="w-full px-4 py-2 bg-[#0f172a] border border-slate-700 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-white">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg transition duration-200 shadow-lg">
                    Submit Job
                </button>
            </form>
        </div>

        <div class="bg-[#1e293b] p-6 rounded-xl shadow-xl border border-slate-700">
            <h2 class="text-xl font-semibold mb-4 text-amber-400">Submission History</h2>
            <div id="historyList" class="space-y-3">
                <p class="text-slate-400 text-sm">Loading history...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = window.ENV_SUPABASE_URL || 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = window.ENV_SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById('jobForm');
        const historyList = document.getElementById('historyList');

        async function fetchHistory() {
            const { data, error } = await supabaseClient
                .from('raw_jobs')
                .select('id, title, status, created_at')
                .order('id', { ascending: false })
                .limit(10);

            if (error) return;

            if (data && data.length > 0) {
                historyList.innerHTML = '';
                data.forEach(job => {
                    let statusColor = job.status === 'success' ? 'bg-green-500/20 text-green-400 border-green-500/30' : 'bg-amber-500/20 text-amber-400 border-amber-500/30';
                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between p-3 bg-[#0f172a] rounded-lg border border-slate-700";
                    item.innerHTML = `
                        <div>
                            <h4 class="font-medium text-white">${job.title}</h4>
                            <span class="text-xs text-slate-400">ID: #${job.id}</span>
                        </div>
                        <span class="px-3 py-1 text-xs font-semibold rounded-full border ${statusColor}">
                            ${job.status}
                        </span>
                    `;
                    historyList.appendChild(item);
                });
            } else {
                historyList.innerHTML = '<p class="text-slate-400 text-sm">No submissions found.</p>';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'Submitting...';

            const payload = {
                title: document.getElementById('title').value,
                snippet: document.getElementById('snippet').value,
                link: document.getElementById('link').value,
                country: document.getElementById('country').value,
                category: document.getElementById('category').value,
                query_used: document.getElementById('query_used').value,
                status: 'pending'
            };

            const { error } = await supabaseClient.from('raw_jobs').insert([payload]);

            if (error) {
                alert('Error: ' + error.message);
            } else {
                form.reset();
                fetchHistory();
            }

            btn.disabled = false;
            btn.innerText = 'Submit Job';
        });

        fetchHistory();
    </script>
</body>
</html>
